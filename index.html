<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immuna — Join the waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal: #1E3B36;
    --teal-soft: #2C4F49;
    --cream: #FAF1DE;
    --card: #FFFFFF;
    --tan: #EFE3C8;
    --terracotta: #C97A45;
    --terracotta-deep: #B4652F;
    --warning-bg: #F3E4C4;
    --warning-border: #E0B978;
    --ink: #1E3B36;
    --muted: #5B6B65;
    --line: rgba(30,59,54,0.14);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  h1, h2, h3{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    margin: 0;
    color: var(--teal);
  }

  .mono{
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 12.5px;
    color: var(--muted);
  }

  header{ padding: 32px 0 0; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ font-family:'Playfair Display', serif; font-weight: 700; font-size: 23px; color: var(--teal); }
  nav a{ color: var(--muted); text-decoration:none; font-size: 14px; margin-left: 28px; }
  nav a:hover{ color: var(--teal); }

  .hero{
    padding: 56px 0 20px;
    text-align: center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1.headline{
    font-size: clamp(36px, 5.6vw, 60px);
    line-height: 1.1;
    max-width: 14ch;
    margin-top: 14px;
  }
  .sub{
    margin-top: 18px;
    max-width: 44ch;
    color: var(--muted);
    font-size: 17px;
  }

  .capture{
    margin-top: 30px;
    display:flex;
    gap: 10px;
    max-width: 440px;
    width: 100%;
    flex-wrap: wrap;
    justify-content:center;
  }
  .capture input[type="email"]{
    flex: 1 1 230px;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--card);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
  }
  .capture input[type="email"]:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .capture button{
    padding: 14px 24px;
    border-radius: 8px;
    border: none;
    background: var(--teal);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  .capture button:hover{ background: var(--teal-soft); }
  .capture-note{ margin-top: 10px; font-size: 13px; color: var(--muted); }

  .phone-stage-wrap{
    width: 100%;
    display:flex;
    justify-content:center;
    overflow: hidden;
    margin-top: 56px;
  }
  .phone-stage{
    position: relative;
    width: 820px;
    flex-shrink: 0;
    display:flex;
    justify-content:center;
    transform-origin: top center;
  }
  .phone{
    position: relative;
    width: 280px;
    background: var(--cream);
    border-radius: 34px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(30,59,54,0.28);
    border: 6px solid var(--teal);
    text-align: left;
  }
  .phone-topbar{
    background: var(--teal);
    padding: 16px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .phone-topbar .wm{ color: var(--cream); font-family:'Playfair Display', serif; font-size: 16px; font-weight:600; }
  .phone-body{ padding: 16px 16px 10px; }
  .phone .mono{ font-size: 9.5px; color: var(--muted); }
  .phone-greeting{ font-family:'Playfair Display', serif; font-size: 21px; font-weight:700; color: var(--ink); margin: 4px 0 2px; line-height:1.15; }
  .phone-welcome{ font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .phone-banner{
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
    display:flex; align-items:center; gap:7px;
  }
  .phone-checkin{
    background: var(--teal);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
    display:flex; align-items:center; gap:10px;
  }
  .phone-checkin .icon-box{ width:32px; height:32px; border-radius:8px; background: var(--teal-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .phone-checkin .lbl{ color: var(--cream); font-size: 13.5px; font-weight: 600; font-family:'Playfair Display', serif; line-height:1.2; }
  .phone-checkin .sub2{ color: rgba(250,241,222,0.7); font-size: 10px; margin-top:2px; }

  .app-card{
    background: var(--card);
    border-radius: 11px;
    padding: 11px;
    margin-bottom: 8px;
    display:flex; align-items:center; gap:10px;
  }
  .app-card:last-child{ margin-bottom: 0; }
  .app-card .icon-box{ width:30px; height:30px; border-radius:8px; background: var(--tan); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .app-card .t{ font-family:'Playfair Display', serif; font-size: 13px; font-weight:600; color: var(--ink); line-height:1.2; }
  .app-card .d{ font-size: 10px; color: var(--muted); margin-top:1px; }
  .app-card .arrow{ margin-left:auto; color: var(--muted); }

  .float-card{
    position:absolute;
    background: var(--card);
    border-radius: 12px;
    padding: 13px 15px;
    box-shadow: 0 14px 30px rgba(30,59,54,0.14);
    display:flex;
    align-items:center;
    gap: 10px;
    width: 210px;
  }
  .float-card .icon{ width: 32px; height: 32px; border-radius: 8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background: var(--tan); }
  .float-title{ font-family:'Playfair Display', serif; font-weight:600; font-size: 14px; color: var(--teal); line-height:1.2; }
  .float-sub{ font-size: 11px; color: var(--muted); margin-top:1px; }

  .float-1{ top: 4%; left: 0; }
  .float-1 .icon{ background: var(--teal); }
  .float-2{ top: 30%; right: 0; }
  .float-2 .icon{ background: var(--terracotta); }
  .float-3{ top: 56%; left: 0; }
  .float-3 .icon{ background: var(--teal-soft); }
  .float-4{ top: 80%; right: 0; }
  .float-4 .icon{ background: var(--tan); }

  @media (max-width: 780px){
    nav{ display:none; }
  }

  @media (max-width: 700px){
    .phone-stage-wrap{ overflow: visible; height: auto !important; }
    .phone-stage{
      width: 100%;
      flex-direction: column;
      align-items: center;
      transform: none !important;
    }
    .phone{ width: min(88vw, 320px); }
    .float-card{
      position: static;
      width: min(88vw, 320px);
      margin: 14px auto 0;
    }
  }

  .stitch{ height: 1px; background: var(--line); margin: 10px 0 0; }

  .features{ padding: 70px 0 70px; }
  .features h2{ font-size: clamp(26px, 3vw, 34px); max-width: 16ch; margin-bottom: 44px; }
  .feature-list{ display:flex; flex-direction: column; }
  .feature-row{
    display:grid; grid-template-columns: 52px 1fr; gap: 20px;
    padding: 24px 0; border-top: 1px solid var(--line); align-items: flex-start;
  }
  .feature-row:last-child{ border-bottom: 1px solid var(--line); }
  .feature-icon{ width: 46px; height: 46px; border-radius: 9px; background: var(--tan); display:flex; align-items:center; justify-content:center; }
  .feature-row h3{ font-size: 19px; font-weight: 600; margin-bottom: 6px; }
  .feature-row p{ margin:0; color: var(--muted); max-width: 52ch; font-size: 15.5px; }

  .community{ padding: 20px 0 80px; display:grid; grid-template-columns: 0.9fr 1.1fr; gap: 56px; align-items:center; }
  .community h2{ font-size: clamp(26px, 3vw, 34px); max-width: 12ch; }
  .community p.lede{ margin-top: 18px; color: var(--muted); max-width: 40ch; font-size: 16px; }
  .network{ width: 100%; height: auto; }
  @media (max-width: 780px){ .community{ grid-template-columns: 1fr; } }

  footer{ border-top: 1px solid var(--line); padding: 30px 0 90px; }
  .footer-row{ display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 14px; }
  .footer-links a{ color: var(--muted); text-decoration:none; font-size: 13.5px; margin-right: 22px; }
  .footer-links a:hover{ color: var(--teal); }
  .footer-meta{ font-size: 13px; color: var(--muted); }

  #cookieBanner{
    display:none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--teal);
    color: var(--cream);
    padding: 18px 24px;
    z-index: 999;
    align-items:center;
    justify-content:center;
    gap: 24px;
    flex-wrap: wrap;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
  }
  #cookieBanner p{ margin:0; font-size: 14px; max-width: 520px; color: rgba(250,241,222,0.9); }
  .cookie-actions{ display:flex; gap: 10px; flex-wrap: wrap; }
  .cookie-actions button{
    font-family:'Inter', sans-serif; font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 7px; cursor: pointer; border: 1.5px solid var(--cream);
  }
  #cookieEssential{ background: transparent; color: var(--cream); }
  #cookieEssential:hover{ background: rgba(250,241,222,0.1); }
  #cookieAccept{ background: var(--cream); color: var(--teal); }
  #cookieAccept:hover{ background: #fff; }
</style>
</head>
<body>

<header class="wrap">
  <div class="header-row">
    <div class="wordmark">Immuna</div>
    <nav>
      <a href="#features">What it does</a>
      <a href="#community">Community</a>
    </nav>
  </div>
</header>

<section class="hero wrap">
  <div class="mono">Coming soon</div>
  <h1 class="headline">Your health. Your journey. Your control.</h1>
  <p class="sub">Immuna is a place to log your symptoms, manage appointments and medication, and find people living the same chapter you are.</p>

        <div class="wm">Immuna</div>

      </div>
      <div class="phone-body">
        <div class="mono">Tuesday 8 September 2026</div>
        <div class="phone-greeting">Good morning, Eloise.</div>
